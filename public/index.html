<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI PM Training Program</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%232B6E63%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2758%27 text-anchor=%27middle%27 fill=%27%23F1F2ED%27 font-family=%27Georgia,serif%27%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="eyebrow">AI PM Training Program</div>
      <h1 id="program-title">Loading…</h1>
      <p class="dek" id="program-subtitle"></p>
    </header>

    <div class="boundary">
      <div class="label">Data boundary</div>
      <p id="scenario-note"></p>
    </div>

    <div class="name-field">
      <label for="name-input">Your name (for your exported artifacts)</label>
      <input type="text" id="name-input" placeholder="e.g. Jordan Ellis" />
    </div>

    <div class="progress-summary">
      <div class="progress-track"><div class="fill" id="progress-fill" style="width:0%"></div></div>
      <span id="progress-text">0 of 6 modules complete</span>
    </div>

    <div class="progress-list card" id="week-list"></div>

    <footer class="foot">
      Every exercise uses a fictional company (Northwind Gear Co.) and fictional data. Progress is saved in this browser only — nothing is sent anywhere.
    </footer>
  </div>

  <script src="/shared.js"></script>
  <script src="/app.js"></script>
</body>
</html>
